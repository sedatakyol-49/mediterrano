<aside class="floating-contact" aria-label="Schnellkontakt">
  <a routerLink="/kontakt" class="floating-contact__link" aria-label="Kontaktformular öffnen">
    <span class="material-symbols-rounded">forum</span>
  </a>
  <a [href]="'tel:' + phoneNumber" class="floating-contact__link" aria-label="Jetzt anrufen">
    <span class="material-symbols-rounded">call</span>
  </a>
  <a [href]="'mailto:' + emailAddress" class="floating-contact__link" aria-label="E-Mail senden">
    <span class="material-symbols-rounded">mail</span>
  </a>
  <a
    [href]="'https://wa.me/' + whatsappNumber"
    target="_blank"
    rel="noopener"
    class="floating-contact__link floating-contact__link--whatsapp"
    aria-label="WhatsApp Nachricht senden">
